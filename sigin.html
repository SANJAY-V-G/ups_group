
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 300px;
            gap: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        p {
            text-align: center;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Sign In</h1>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button type="submit">Sign In</button>

        <p><a href="#">Forgot your password?</a></p>
        <p><a href="signup.html">Don't have an account? Sign up</a></p>
    </div>

</body>
</html>
